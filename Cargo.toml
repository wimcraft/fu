[package]
name = "fu"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
description = "Fast keyboard-driven image viewer for macOS terminals"
license = "MIT"
repository = "https://github.com/rfist/fu"
readme = "README.md"
exclude = ["fu"]

[lib]
name = "fu"
path = "src/lib.rs"

[[bin]]
name = "fu"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25.10"
crossterm = "0.29.0"
clap = { version = "4.6.5", features = ["derive"] }
thiserror = "2.0.19"
base64 = "0.22.1"

[profile.release]
opt-level = 3
